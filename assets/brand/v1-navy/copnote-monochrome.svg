      <g stroke="#000" stroke-width="20" stroke-linecap="round">
        <line x1="420" y1="430" x2="604" y2="430"/>
        <line x1="420" y1="490" x2="604" y2="490"/>
        <line x1="420" y1="550" x2="604" y2="550"/>
        <line x1="420" y1="610" x2="540" y2="610"/>
        <path d="M570 668 L606 632"/>

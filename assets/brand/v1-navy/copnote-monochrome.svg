      <rect width="1024" height="1024" fill="#fff"/>
      <path d="M512 190 L768 278 V500 C768 668 662 776 512 838 C362 776 256 668 256 500 V278 Z" fill="#000"/>
      <path d="M512 232 L521 258 H549 L527 274 L535 300 L512 284 L489 300 L497 274 L475 258 H503 Z" fill="#fff"/>
      <path d="M382 330 H592 L642 380 V720 H382 Z" fill="#fff"/>
